name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIFROST_IMPLEMENTATION: mock
      TAVILY_MODE: mock
      ALLOW_PAID_REQUESTS: 'false'
      TAVILY_MAX_REQUESTS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:contracts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --manifest-path crates/neuromesh-bridge/Cargo.toml --check
      - run: cargo test --manifest-path crates/neuromesh-bridge/Cargo.toml --locked
      - run: cargo build --manifest-path crates/neuromesh-bridge/Cargo.toml --locked
